<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <script>
      // Apply theme before first paint so dark mode loads without a white flash
      try {
        if (localStorage.getItem("theme") === "light") {
          document.documentElement.classList.remove("dark");
        } else {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {
        document.documentElement.classList.add("dark");
      }
    </script>
    <title>Eugene Belong | Portfolio & Resume</title>
    <link rel="icon" type="image/png" href="/eugene_icon_favicon.png" />
    <link rel="apple-touch-icon" href="/eugene_icon_favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #ffffff;
      }

      /* Dark is the default theme */
      html.dark, html.dark body {
        background-color: #1C1C1C;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
